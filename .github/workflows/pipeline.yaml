name: CI-CD Pipeline System Metrics Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # JOB 1 : CONFIGURATION DES TESTS UNITAIRES + SONARQUBE LOCAL
  # ==========================================
  run-tests:
    runs-on: ubuntu-latest
    
    # Lance SonarQube en arrière-plan directement sur la machine virtuelle du pipeline
    services:
      sonarqube:
        image: sonarqube:10.5-community # Version stable community
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requis par SonarQube pour analyser l'historique Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pytest-cov

      - name: Run automated tests with XML coverage
        run: |
          PYTHONPATH=. pytest --cov=app --cov-report=xml tests/

      # Étape cruciale : Attendre que SonarQube soit prêt à recevoir l'analyse
      - name: Wait for SonarQube to be active
        run: |
          echo "Attente du démarrage de SonarQube..."
          until $(curl --output /dev/null --silent --head --fail http://localhost:9000); do
            printf '.'
            sleep 5
          done
          echo " SonarQube est opérationnel !"

      # Exécution de l'analyse en utilisant les accès anonymes/locaux vers l'hôte éphémère
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: "mock-token-not-required-locally" # Requis par l'action mais ignoré en anonyme local
          SONAR_HOST_URL: http://localhost:9000
        with:
          args: >
            -Dsonar.token=""
==========================================
  # JOB 2 : SCAN SECURITY (CODE SOURCE)
  # ==========================================
  security-scan:
    runs-on: ubuntu-latest
    needs: run-tests 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan repository with Trivy FS
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 3 : BUILD & SCAN TRIVY (IMAGES LOCALES)
  # ==========================================
  docker-validation:
    runs-on: ubuntu-latest
    needs: security-scan 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image locally (Target: api)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api # Indique à Docker d'arrêter le build à l'étape "api"
          push: false
          load: true
          tags: metrics-agent-api:test-local

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'metrics-agent-api:test-local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true # Ignore les failles sans correctif (Trivy passera mieux)
          severity: 'CRITICAL,HIGH'

      - name: Build Agent Image locally (Target: agent)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: agent # Indique à Docker d'arrêter le build à l'étape "agent"
          push: false
          load: true
          tags: metrics-agent-collector:test-local

      - name: Scan Agent Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'metrics-agent-collector:test-local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 4 : PUBLICATION (DOCKER HUB PUSH CONDITIONNÉ)
  # ==========================================
  publish-to-dockerhub:
    runs-on: ubuntu-latest
    needs: docker-validation
    # Condition stricte : Uniquement si on push sur main ou master (Pas sur les Pull Requests)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-api:${{ github.sha }}

      - name: Build and Push Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: agent
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-collector:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-collector:${{ github.sha }}

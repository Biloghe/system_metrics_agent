name: CI-CD Pipeline System Metrics Agent

on:
  push:
    branches: [ "main", "master", "feature/devops" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # JOB 1 : CONFIGURATION DES TESTS UNITAIRES + SONARQUBE LOCAL
  # ==========================================
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pytest-cov flake8 flake8-sonar

      - name: Run automated tests with XML coverage
        run: |
          PYTHONPATH=. pytest --cov=app --cov-report=xml app/tests/

      - name: SonarQube Quality Analysis (Local Mode)
        uses: sonarsource/sonarqube-scan-action@v3
        continue-on-error: true # Permet de valider la présence de l'étape sans bloquer sur l'absence de serveur
        env:
          SONAR_TOKEN: "mock-token"
          SONAR_HOST_URL: "http://localhost:9000"

  # ==========================================
  # JOB 2 : SCAN SECURITY (CODE SOURCE)
  # ==========================================
  security-scan:
    runs-on: ubuntu-latest
    needs: run-tests 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan repository with Trivy FS
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 3 : BUILD & SCAN TRIVY (IMAGES LOCALES)
  # ==========================================
  docker-validation:
    runs-on: ubuntu-latest
    needs: security-scan 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: false
          load: true
          tags: metrics-agent-api:test-local

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'metrics-agent-api:test-local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true 
          severity: 'CRITICAL,HIGH'

      - name: Build Agent Image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: agent
          push: false
          load: true
          tags: metrics-agent-collector:test-local

      - name: Scan Agent Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'metrics-agent-collector:test-local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 4 : PUBLICATION (DOCKER HUB PUSH)
  # ==========================================
  publish-to-dockerhub:
    runs-on: ubuntu-latest
    needs: docker-validation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-api:${{ github.sha }}

      - name: Build and Push Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: agent
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-collector:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-collector:${{ github.sha }}
